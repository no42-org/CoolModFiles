name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/no42-org/coolmodfiles

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Fail fast if the tag and package.json version disagree. Without
      # this guard a release could ship with a stale package.json (and a
      # stale npm "name@version" identifier in any tooling that reads it)
      # while the git tag, container tags, and APP_VERSION env all carry
      # the new number — silent drift that's only noticeable downstream.
      # See RELEASING.md for the human-side procedure.
      - name: Verify package.json version matches tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${REF_NAME} (=> ${tag_version}) does not match package.json version ${pkg_version}. Bump package.json before tagging — see RELEASING.md." >&2
            exit 1
          fi

      - run: make verify

  # Each platform builds natively on its own runner and pushes an
  # untagged image by digest. Emulated arm64 builds under QEMU hung
  # intermittently in `npm ci` (SIGILL) for up to 6 h (#242).
  build:
    needs: verify
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform digests into one multi-arch index, tags
  # it, signs it and drafts the release.
  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Job-scoped permissions: any future job in this workflow (e.g. a
    # notification or SBOM uploader) must opt-in to id-token minting
    # rather than inherit it.
    permissions:
      contents: write
      packages: write
      # Required for cosign's keyless signing flow: the runner requests
      # an OIDC token from GitHub which Sigstore's Fulcio exchanges for
      # a short-lived signing certificate. No long-lived keys are
      # stored in the repo or in GitHub Secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          # Pin the cosign binary explicitly so a Dependabot bump of the
          # installer action doesn't silently change the signer version
          # under us. Dependabot also tracks `cosign-release:` updates.
          cosign-release: v3.0.6

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push multi-arch index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign image with cosign (keyless / OIDC)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          # Fail fast on an empty tag list — without this guard, a
          # downstream change that produces zero tags would silently
          # publish an unsigned image with the workflow green.
          if [ -z "${TAGS}" ]; then
            echo "::error::No tags produced by metadata-action; refusing to leave image unsigned" >&2
            exit 1
          fi
          # Sign each tag@digest reference, recursing into the
          # per-platform child manifests of the multi-arch image index.
          # Without --recursive, only the index is signed; policy
          # engines that pin to per-platform digests (Kyverno,
          # sigstore policy-controller) would fail to verify amd64/arm64
          # child manifests directly.
          #
          # Verify with:
          #   cosign verify ghcr.io/no42-org/coolmodfiles:vX.Y.Z \
          #     --certificate-identity-regexp '^https://github\.com/no42-org/CoolModFiles/\.github/workflows/release\.yml@refs/tags/v.*$' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            cosign sign --yes --recursive "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      - name: Create GitHub Release (draft, auto-generated notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft
