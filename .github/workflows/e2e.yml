name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Firefox uses cubeb for audio and needs a real backend — without
      # one, AudioContext can't transition to 'running' regardless of any
      # JS fix. Chromium and WebKit have built-in null sinks; Firefox
      # doesn't. Install and start pulseaudio so cubeb has a socket.
      - name: Install and start PulseAudio (Firefox audio backend)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
